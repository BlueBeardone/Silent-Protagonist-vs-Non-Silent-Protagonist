services:
  - type: web
    name: silent-protagonist
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: EMAIL_ENCRYPTION_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: parallel/decisions-fast:free
      - key: CSP
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: RETENTION_DAYS
        value: "365"
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: "linux:silent-protagonist-vs-non-silent:1.0 (by /u/unknown)"
